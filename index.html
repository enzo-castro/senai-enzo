<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
 function myFunction() {
    let imput = document.getElementById("myInput")
    let div = document.getElementById("myDiv")
  for(let i = 0; i < 10; i++) {
    div.innerHTML += imput.value + "<br>"
  }
 }
</script>
<body>
    <input type="text" id="myInput" placeholder="Digite algo...">
    <button onclick="myFunction()">clique em mim</button>
    <div id="myDiv"></div>
</body>
</html>
