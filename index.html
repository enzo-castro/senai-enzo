<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Busca CEP</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>

.video-bg{
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    body{
      background-color: #bebebe;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .card{
        background-color: rgba(132, 9, 163, 0.719);
      width:100%;
      max-width:500px;
      border:rgb(0, 0, 0) 2px solid;
      border-radius:30px;
    }

  </style>
</head>

<body>

 <video autoplay muted loop class="video-bg">
    <source src="189172-884987257_medium.mp4" type="video/mp4">
  </video>

  <div class="card shadow p-3">

    <h3 class="text-center mb-5">
      Buscar CEP
    </h3>

    <div class="row g-4">

      <!-- CEP -->
      <div class="col-8">

        <input
          type="text"
          id="cep"
          class="form-control"
          placeholder="Digite o CEP"
        >

      </div>

      <!-- BOTÃO -->
      <div class="col-4">

        <button
          class="btn btn-primary w-100"
          onclick="buscarCEP()"
        >
          buscar
        </button>

      </div>

      <!-- RUA -->
      <div class="col-12">

        <input
          type="text"
          id="rua"
          class="form-control"
          placeholder="Rua"
        >

      </div>

      <!-- BAIRRO -->
      <div class="col-6">

        <input
          type="text"
          id="bairro"
          class="form-control"
          placeholder="Bairro"
        >

      </div>

      <!-- CIDADE -->
      <div class="col-6">

        <input
          type="text"
          id="cidade"
          class="form-control"
          placeholder="Cidade"
        >

      </div>

      <!-- ESTADO -->
      <div class="col-6">

        <select class="form-select">
          <option>Casa</option>
          <option>Apartamento</option>
        </select>

      </div>

      <!-- CHECKBOX -->
      <div class="col-6 d-flex align-items-center">

        <div class="form-check">

          <input
            class="form-check-input"
            type="checkbox"
          >

          <label class="form-check-label">
            Receber email
          </label>

        </div>

      </div>

      <!-- OBS -->
      <div class="col-12">

        <textarea
          class="form-control"
          rows="3"
          placeholder="Observações..."
        ></textarea>

      </div>

      <!-- BOTÃO -->
      <div class="col-12">

        <button class="btn btn-success w-100">
          Salvar
        </button>

      </div>

    </div>

  </div>

  <script>

    async function buscarCEP(){

      let cep =
        document.getElementById("cep").value;

      let response = await fetch(
        `https://viacep.com.br/ws/${cep}/json/`
      );

      let data = await response.json();

      document.getElementById("rua").value =
        data.logradouro;

      document.getElementById("bairro").value =
        data.bairro;

      document.getElementById("cidade").value =
        data.localidade;

    }

  </script>

</body>

</html>
