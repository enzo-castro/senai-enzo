<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>verificação de login</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>
function login() {
  let usuario = document.getElementById("usuario").value;
  let senha = document.getElementById("senha").value;
  if(usuario === "enzo" && senha === "1234") {
    alert("Login bem-sucedido!");
    mostranome();
    escondeLogin();

} 
  }

function mostranome() {
  let telainicial = document.getElementById("nome").style.display = "block";
}

function escondeLogin() {
  document.getElementById("login").style.display = "none";
}
function logout() {
  document.getElementById("nome").style.display = "none";
  document.getElementById("login").style.display = "block";
}
  


</script>

<style>
    .estilo{
        font-family: 'Times New Roman', Times, serif;
    }
</style>

<body>

    <section class="" id="login">
    <div><h1>Sistema Senai-Enzo</h1></div>
  <input type="text" placeholder="Digite seu usuário..." id="usuario"><br>
   <input type="text" placeholder="Digite sua senha..." id="senha"><br>
   <input type="button" class="btn btn-info" value="Entrar" onclick="login()"><br>
   <input type="button" class="btn btn-danger" value="sair" onclick="logout()" style="display:none;"><br>
</section>

<section class="" id="nome" style="display:none;">
    <div class=""><h1>Bem-vindo ao sistema, Enzo!</h1>
    </div>
</section>


</body>

</html>
